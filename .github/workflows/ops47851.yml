name: ops47851
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          JOB: ${{ matrix.job }}
          TOPIC: 'i47851db7k2x'
        run: python3 probe.py
